[package]
name = "drsm"
description = "Dylan's Rusty Stack Machine"
version = "0.14.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
documented = "0.9.2"
indexmap = "2.14.0"
lean_string = "0.6.0"
logos = "0.16.1"
rustyline = "18.0.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = "0.8.2"
itertools = "0.14.0"
proptest = "1.11.0"

[lib]
bench = false

[[bin]]
name = "drsm"
path = "src/main.rs"
bench = false

[[bench]]
name = "fib"
harness = false

[[bench]]
name = "zero_sum"
harness = false
